[project]
name = "campushub-backend"
version = "0.1.0"
description = "CampusHub FastAPI backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "email-validator>=2.1",
    "python-multipart>=0.0.9",
    "redis>=5.0",
    "python-jose[cryptography]>=3.3",
    "argon2-cffi>=23.1",
    "boto3>=1.34",
    "livekit-api>=0.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "aiosqlite>=0.20",
    "httpx>=0.27",
    # Exact-pinned, not >=: both tools add newly-enabled lint/format rules
    # even across minor versions, and an unpinned CI install silently
    # drifted ahead of what was last verified locally, breaking the gate on
    # code nobody actually changed. Dependabot proposes bumps as reviewable
    # PRs (own CI run first) rather than this floating unpinned.
    "ruff==0.16.3",
    "black==26.5.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency-injection API is *designed* around calling Depends()
# (and friends) as an argument default (https://fastapi.tiangolo.com/tutorial/dependencies/) —
# each call returns a lightweight sentinel, not a mutable value, so B008's
# general "function call in default argument" warning is a false positive
# here. Without this, ~125 idiomatic route/dependency signatures across the
# whole backend flag as errors.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Body",
    "fastapi.Header",
    "fastapi.Cookie",
    "fastapi.Security",
    "fastapi.File",
    "fastapi.Form",
    # This app's own dependency factory (app/core/security.py) — same
    # pattern as Depends() above: it returns a dependency callable, not a
    # mutable value, so calling it in a default argument is the intended
    # usage (e.g. `Depends(require_role("super_admin"))`).
    "app.core.security.require_role",
]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.setuptools.packages.find]
include = ["app*"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
