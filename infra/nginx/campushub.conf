# Production reverse proxy — native NGINX install (no containers).
# TLS termination, API + WebSocket routing per docs/13-deployment-guide.md.
#
# Certificates: this assumes certbot's nginx/webroot flow has already
# provisioned /etc/letsencrypt/live/campushub/{fullchain,privkey}.pem before
# this file is loaded — point ssl_certificate/ssl_certificate_key elsewhere
# if using a different CA. Renewal depends on the ACME challenge location
# below staying reachable over plain HTTP, so don't fold it into the
# redirect.

server {
    listen 80;
    server_name campushub.example.edu;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name campushub.example.edu;

    ssl_certificate     /etc/letsencrypt/live/campushub/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/campushub/privkey.pem;

    # docs/08-security-design.md section 4: TLS 1.2+ only, HSTS enabled.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /ws/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
