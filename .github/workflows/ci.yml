name: CI

on:
  pull_request:
  push:
    branches: [master]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install .[dev]
        working-directory: backend
      - run: ruff check . && black --check .
        working-directory: backend
      - run: pytest
        working-directory: backend
      # A01/A06 (docs/08-security-design.md): fail the build on newly
      # disclosed dependency vulnerabilities. PYSEC-2026-1325 is ignored —
      # it's a Minerva timing attack on ecdsa's ECDSA *signing* path
      # (upstream has stated there's no planned fix), pulled in transitively
      # by python-jose; this app mints/verifies tokens with RS256 only
      # (app/core/security.py ALGORITHM = "RS256"), so that path is never
      # exercised. Re-evaluate if the app ever adds an ECDSA-signed flow.
      - run: pip install pip-audit && pip-audit --ignore-vuln PYSEC-2026-1325
        working-directory: backend

  client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          # Pinned to the exact version verified locally (`flutter analyze`
          # clean, all tests passing) — unpinned `channel: stable` tracks
          # whatever is newest at run time, which silently drifted ahead of
          # the local toolchain and started failing analyze on lint rules
          # that didn't exist when this was last verified. Bump deliberately,
          # re-verifying locally each time, not by leaving this unpinned.
          flutter-version: "3.44.1"
      - run: flutter pub get
        working-directory: client
      - run: dart format --output=none --set-exit-if-changed .
        working-directory: client
      - run: flutter analyze
        working-directory: client
      - run: flutter test
        working-directory: client
